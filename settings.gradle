pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.6'
}

rootProject.name = 'seamless-gradient-glass'

stonecutter {
    create(rootProject) {
        versions('1.21.1', '1.21.8')
        vcsVersion = '1.21.8'
    }
}
