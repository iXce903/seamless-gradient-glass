pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.10'
}

rootProject.name = 'seamless-gradient-glass'

stonecutter {
    create(rootProject) {
        versions('26.1.2', '26.2', '26.3')
        vcsVersion = '26.3'
    }
}
