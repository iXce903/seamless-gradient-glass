plugins {
    id 'fabric-loom' version "${loom_version}"
}

def mcVersion = stonecutter.current.version

version = "${project.mod_version}+${mcVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.isxander.dev/releases' }
    maven { url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional: the config screen needs both.
    modCompileOnly("dev.isxander:yet-another-config-lib:${project.yacl_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", mcVersion

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": mcVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.register('buildAndCollect', Copy) {
    group = 'build'
    description = 'Builds this version and copies its jar to the root build/libs folder.'
    dependsOn tasks.named('build')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into(rootProject.layout.buildDirectory.dir('libs'))
}
