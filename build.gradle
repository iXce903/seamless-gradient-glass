plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def mcVersion = stonecutter.current.version

version = "${project.mod_version}+${mcVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.isxander.dev/releases' }
    maven { url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional: the config screen needs both.
    compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    localRuntime "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", mcVersion

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": mcVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('buildAndCollect', Copy) {
    group = 'build'
    description = 'Builds this version and copies its jar to the root build/libs folder.'
    dependsOn tasks.named('build')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(rootProject.layout.buildDirectory.dir('libs'))
}
