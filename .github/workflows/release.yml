name: Build & Release (Minecraft 26.x)

on:
  push:
    branches: [ "26.x" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all 26.x versions with Stonecutter
        run: ./gradlew build --no-daemon

      - name: Collect built JARs
        run: |
          mkdir -p dist
          for f in versions/*/build/libs/*.jar; do
            case "$f" in
              *-sources.jar) ;;
              *) cp "$f" dist/ ;;
            esac
          done
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seamless-gradient-glass-26.x-jars
          path: dist/*.jar

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
